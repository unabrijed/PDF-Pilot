<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141310" />
    <title>PDFPilot, PDF tools in your browser</title>
    <meta name="description" content="Free PDF tools that run entirely in your browser. Merge, split, compress, sign, OCR and more. Nothing is uploaded." />
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDFPilot" />
    <meta property="og:title" content="PDFPilot, PDF tools in your browser" />
    <meta property="og:description" content="Free PDF tools that run entirely in your browser. Nothing is uploaded." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before first paint (no flash): saved choice, else system.
      var t = localStorage.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.classList.toggle("dark", t === "dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
